name: noxoj

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noxoj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noxoj_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-noxoj}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noxoj}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: ${PORT:-8081}
      # "postgres" — the Compose service name — not "localhost": inside
      # the container, that's the only way to reach the postgres service.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-noxoj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noxoj_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-noxoj}
    ports:
      - "${PORT:-8081}:${PORT:-8081}"
    depends_on:
      postgres:
        condition: service_healthy

  # One-off tool, not a long-running service — excluded from a plain
  # `docker compose up` via the "tools" profile. Invoke explicitly:
  #   docker compose run --rm migrate up
  #   docker compose run --rm migrate down 1
  #   docker compose run --rm migrate create -ext sql -dir /migrations -seq <name>
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    volumes:
      - ./db/migrations:/migrations
    entrypoint:
      [
        "migrate",
        "-path", "/migrations",
        "-database", "postgres://${POSTGRES_USER:-noxoj}:${POSTGRES_PASSWORD:-noxoj_dev_password}@postgres:5432/${POSTGRES_DB:-noxoj}?sslmode=disable",
      ]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
